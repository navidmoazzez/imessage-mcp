name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # chat.db and AppleScript are macOS-only, so CI runs where the code runs.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun test
